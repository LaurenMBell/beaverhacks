<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benton County Healthcare Finder</title>
    <meta
      name="description"
      content="Find healthcare services in Benton County, Oregon with Google Maps Places."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <section class="sidebar">
        <div class="sidebar-header">
          <div>
            <div class="eyebrow">Benton County, Oregon</div>
            <h1>Healthcare Finder</h1>
          </div>
          <div class="sidebar-mark" aria-hidden="true">+</div>
        </div>

        <div class="service-picker">
          <p class="service-picker-label">Healthcare services</p>
          <div class="chip-group" aria-label="Healthcare service filters">
            <button class="chip is-active" data-service="primary-care" type="button">
              Primary care
            </button>
            <button class="chip" data-service="urgent-care" type="button">
              Urgent care
            </button>
            <button class="chip" data-service="hospital" type="button">
              Hospitals
            </button>
            <button class="chip" data-service="dentist" type="button">
              Dental care
            </button>
            <button class="chip" data-service="pharmacy" type="button">
              Pharmacies
            </button>
            <button class="chip" data-service="mental-health" type="button">
              Mental health
            </button>
            <button class="chip" data-service="womens-health" type="button">
              Women's health
            </button>
            <button class="chip" data-service="pediatrics" type="button">
              Pediatrics
            </button>
            <button class="chip" data-service="physical-therapy" type="button">
              Physical therapy
            </button>
            <button class="chip" data-service="medical-lab" type="button">
              Medical labs
            </button>
          </div>
        </div>

        <form id="search-form" class="search-panel">
          <label class="field">
            <span>Location</span>
            <input
              id="location-input"
              type="text"
              name="location"
              value="97330"
              placeholder="Enter an address or ZIP code"
            />
          </label>
          <label class="field">
            <span>Mode of Transportation</span>
            <select id="transportation-select" name="transportation">
              <option value="drive">Drive</option>
              <option value="walk">Walk</option>
              <option value="bike">Bike</option>
            </select>
          </label>

          <label class="field">
            <span>Max Travel Time</span>
            <select id="travel-time">
              <option value="">Any</option>
              <option value="15">15 min</option>
              <option value="20">20 min</option>
              <option value="30">30 min</option>
            </select>
          </label>

          <label class="field">
            <span>Optional keywords</span>
            <input
              id="keywords-input"
              type="text"
              name="keywords"
              placeholder="Example: Medicaid, bilingual, sliding scale"
            />
          </label>

          <label class="checkbox-row">
            <input id="open-now-input" type="checkbox" name="open-now" />
            <span>Open now</span>
          </label>

          <button id="search-button" class="search-button" type="submit">
            Search healthcare services
          </button>
        </form>

        <section id="insurance-form-section">
          <h2>Find Your Insurance Plans</h2>
          <form id="insurance-form">
            <div class="insurance-form-row">
              <div class="insurance-form-group">
                <label for="insurance-zip">ZIP Code</label>
                <input type="text" id="insurance-zip" placeholder="97330" maxlength="5" />
              </div>
              <div class="insurance-form-group">
                <label for="insurance-income">Annual Household Income ($)</label>
                <input type="number" id="insurance-income" placeholder="40000" min="0" />
              </div>
              <div class="insurance-form-group">
                <label for="insurance-age">Age</label>
                <input type="number" id="insurance-age" placeholder="30" min="0" max="120" />
              </div>
              <div class="insurance-form-group">
                <label for="insurance-gender">Gender</label>
                <select id="insurance-gender">
                  <option value="Female">Female</option>
                  <option value="Male">Male</option>
                </select>
              </div>
              <div class="insurance-form-group">
                <label for="insurance-tobacco">Tobacco user?</label>
                <select id="insurance-tobacco">
                  <option value="false">No</option>
                  <option value="true">Yes</option>
                </select>
              </div>
            </div>
          <button type="submit" id="insurance-search-btn">Find Plans</button>
          </form>
        </section>
        
        <section id="price-form-section" class="price-form-section">
          <h2>Compare Procedure Prices</h2>
          <form id="price-form">
            <label class="field">
              <span>Procedure</span>
              <input
                id="procedure-input"
                type="text"
                placeholder="Example: hip replacement, heart failure, pneumonia"
              />
            </label>

            <button id="price-search-btn" type="submit">
              Compare Prices
            </button>
          </form>
          <div id="price-results"></div>
        </section>


      <div class="chip-group" aria-label="Quick service filters">

          
        <div class="chip-group" aria-label="Quick service filters">
          <button class="chip is-active" data-service="primary-care" type="button">
            Primary care
          </button>
          <button class="chip" data-service="urgent-care" type="button">
            Urgent care
          </button>
          <button class="chip" data-service="mental-health" type="button">
            Mental health
          </button>
          <button class="chip" data-service="pharmacy" type="button">
            Pharmacies
          </button>
        </div>
      </section>

      <section class="map-panel">
        <div class="map-header">
          <div>
            <p class="results-label">View</p>
            <h2 id="results-title">Search Benton County healthcare services</h2>
          </div>
          <div class="view-controls">
            <div id="summary-pill" class="summary-pill">Ready</div>
            <button
              id="view-toggle"
              class="view-toggle"
              type="button"
              aria-label="Toggle between results and map"
              aria-pressed="false"
            >
              <span class="view-toggle-track">
                <span class="view-toggle-thumb"></span>
              </span>
              <span class="view-toggle-labels">
                <span class="view-toggle-label view-toggle-label-map">Map</span>
                <span class="view-toggle-label view-toggle-label-results">Results</span>
              </span>
            </button>
          </div>
        </div>
        <div id="status-message" class="status-message map-status">
          Enter a location and choose a service type to begin.
        </div>
        <div class="view-window">
          <div
            id="results-view"
            class="panel-view panel-view-active results-view"
            aria-label="Healthcare search results"
          >
            <div id="results-list" class="results-list"></div>
          </div>
          <div
            id="map-view"
            class="panel-view map-view"
            aria-label="Map of healthcare services"
            hidden
          >
            <div id="map" class="map"></div>
          </div>
        </div>
      </section>
    </div>
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
    <button id="chat-toggle" onclick="toggleChat()">💬 Get Advice From AI</button>

    <!-- Chat window -->
    <div id="chat-window" style="display:none">
      <div id="chat-header">
        <span>🏥 Healthcare Assistant</span>
        <button onclick="toggleChat()">✕</button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-input-area">
        <input 
          type="text" 
          id="chat-input" 
          placeholder="Describe your symptoms..."
          onkeypress="if(event.key==='Enter') sendMessage()"
        />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </body>
</html>

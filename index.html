<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benton County Healthcare Finder</title>
    <meta
      name="description"
      content="Find healthcare services in Benton County, Oregon with Google Maps Places."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <section class="sidebar">
        <div class="eyebrow">Benton County, Oregon</div>
        <h1>Healthcare Finder</h1>

        <form id="search-form" class="search-panel">
          <label class="field">
            <span>Location</span>
            <input
              id="location-input"
              type="text"
              name="location"
              value="97330"
              placeholder="Enter an address or ZIP code"
            />
          </label>

          <label class="field">
            <span>Healthcare service</span>
            <select id="service-select" name="service">
              <option value="primary-care">Primary care</option>
              <option value="urgent-care">Urgent care</option>
              <option value="hospital">Hospitals</option>
              <option value="dentist">Dental care</option>
              <option value="pharmacy">Pharmacies</option>
              <option value="mental-health">Mental health</option>
              <option value="womens-health">Women's health</option>
              <option value="pediatrics">Pediatrics</option>
              <option value="physical-therapy">Physical therapy</option>
              <option value="medical-lab">Medical labs</option>
            </select>
          </label>

          <label class="field">
            <span>Optional keywords</span>
            <input
              id="keywords-input"
              type="text"
              name="keywords"
              placeholder="Example: Medicaid, bilingual, sliding scale"
            />
          </label>

          <label class="checkbox-row">
            <input id="open-now-input" type="checkbox" name="open-now" />
            <span>Open now</span>
          </label>

          <button id="search-button" class="search-button" type="submit">
            Search healthcare services
          </button>
        </form>

        <div class="chip-group" aria-label="Quick service filters">
          <button class="chip is-active" data-service="primary-care" type="button">
            Primary care
          </button>
          <button class="chip" data-service="urgent-care" type="button">
            Urgent care
          </button>
          <button class="chip" data-service="mental-health" type="button">
            Mental health
          </button>
          <button class="chip" data-service="pharmacy" type="button">
            Pharmacies
          </button>
        </div>
      </section>

      <section class="map-panel">
        <div class="map-header">
          <div>
            <p class="results-label">View</p>
            <h2 id="results-title">Search Benton County healthcare services</h2>
          </div>
          <div class="view-controls">
            <div id="summary-pill" class="summary-pill">Ready</div>
            <button
              id="view-toggle"
              class="view-toggle"
              type="button"
              aria-label="Toggle between results and map"
              aria-pressed="false"
            >
              <span class="view-toggle-track">
                <span class="view-toggle-thumb"></span>
              </span>
              <span class="view-toggle-labels">
                <span class="view-toggle-label view-toggle-label-map">Map</span>
                <span class="view-toggle-label view-toggle-label-results">Results</span>
              </span>
            </button>
          </div>
        </div>
        <div id="status-message" class="status-message map-status">
          Enter a location and choose a service type to begin.
        </div>
        <div class="view-window">
          <div
            id="results-view"
            class="panel-view panel-view-active results-view"
            aria-label="Healthcare search results"
          >
            <div id="results-list" class="results-list"></div>
          </div>
          <div
            id="map-view"
            class="panel-view map-view"
            aria-label="Map of healthcare services"
            hidden
          >
            <div id="map" class="map"></div>
          </div>
        </div>
      </section>
    </div>

    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
